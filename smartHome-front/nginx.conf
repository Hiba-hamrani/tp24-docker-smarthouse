server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Application Angular (SPA) : toute route inconnue (/devices, /category...)
    # renvoie index.html, sinon un rafraichissement de page donne une 404 Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
